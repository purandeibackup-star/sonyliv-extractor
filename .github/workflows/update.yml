name: Auto Refresh SonyLIV Links

on:
  schedule:
    # Runs at minute 35 of every UTC hour. 
    # Because of the +5:30 IST offset, this will trigger exactly at 5 minutes past every IST hour (e.g., 8:05 PM IST, 9:05 PM IST).
    - cron: "35 * * * *"
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install yt-dlp requests[socks]

      - name: Run Extractor Script
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python extractor.py

      - name: Commit and Push Updated Playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          if git diff --staged --quiet; then
            echo "No changes in playlist URLs."
          else
            git commit -m "Auto-update stream links [skip ci]"
            git push
          fi
