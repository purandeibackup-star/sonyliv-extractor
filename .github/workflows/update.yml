name: Auto Refresh SonyLIV Links

on:
  schedule:
    # Runs every 3 hours. SonyLIV tokens usually last a few hours.
    - cron: "0 */3 * * *"
  workflow_dispatch: # Allows you to run it manually

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Run Extractor Script
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python extractor.py

      - name: Commit and Push Updated Playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          if git diff --staged --quiet; then
            echo "No changes in playlist URLs."
          else
            git commit -m "Auto-update stream links [skip ci]"
            git push
          fi
