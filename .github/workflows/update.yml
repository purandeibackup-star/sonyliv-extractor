name: Auto Refresh SonyLIV Links

on:
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Required to manipulate git history for the amend command
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install yt-dlp requests[socks]

      - name: Run Extractor Script
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python extractor.py

      - name: Commit and Push Updated Playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          if git diff --staged --quiet; then
            echo "No changes in playlist URLs."
          else
            # IMPROVEMENT 3: Replaces the previous commit instead of stacking thousands of them
            git commit --amend -m "Auto-update stream links [skip ci]" || git commit -m "Auto-update stream links [skip ci]"
            git push --force
          fi
